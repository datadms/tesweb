<script src="https://cdn.tailwindcss.com"></script>

<div id="app-dashboard" class="max-w-6xl mx-auto p-4 font-sans">
  <h2 class="text-2xl font-bold text-gray-800 mb-4">Dashboard Informasi Inventaris</h2>
  
  <!-- Loading State -->
  <div id="loading-state" class="flex items-center justify-center py-12">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
    <span class="ml-3 text-gray-600 font-medium">Memuat data inventaris dan foto...</span>
  </div>

  <!-- Dashboard Content (Hidden by default) -->
  <div id="dashboard-content" class="hidden">
    <!-- Ringkasan Statistik -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg shadow-sm">
        <p class="text-sm text-blue-600 font-semibold">Total Baris Data</p>
        <p id="stat-rows" class="text-2xl font-bold text-blue-900">0</p>
      </div>
      <div class="bg-green-50 border border-green-200 p-4 rounded-lg shadow-sm">
        <p class="text-sm text-green-600 font-semibold">Total Jumlah Barang (JML)</p>
        <p id="stat-total" class="text-2xl font-bold text-green-900">0</p>
      </div>
      <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-lg shadow-sm">
        <p class="text-sm text-emerald-600 font-semibold">Kondisi Baik</p>
        <p id="stat-good" class="text-2xl font-bold text-emerald-900">0</p>
      </div>
    </div>

    <!-- Tabel Data dengan Kolom Foto -->
    <div class="overflow-x-auto bg-white border border-gray-200 rounded-lg shadow-sm">
      <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
        <thead class="bg-gray-50 text-gray-700 uppercase font-semibold text-xs">
          <tr>
            <th class="px-4 py-3">Foto</th>
            <th class="px-4 py-3">Ruangan</th>
            <th class="px-4 py-3">Kode Barang</th>
            <th class="px-4 py-3">Nama Barang</th>
            <th class="px-4 py-3">Merk / Type</th>
            <th class="px-4 py-3">Jml</th>
            <th class="px-4 py-3">Tahun</th>
            <th class="px-4 py-3">Pengguna</th>
            <th class="px-4 py-3">Kondisi</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-gray-200 text-gray-600">
          <!-- Data dinamis dimasukkan di sini -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Ganti URL di bawah dengan URL Web App Google Apps Script Anda
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwv8Yx09NrRsINZoAlPAna6h1x7yv0hRbnn_e41_sDFCcPk46p0-VmF6ZhGrOFkLWVv/exec";

  async function fetchInventoryData() {
    try {
      const response = await fetch(WEB_APP_URL);
      const result = await response.json();
      
      if(result.status === "success") {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('dashboard-content').classList.remove('hidden');
        
        document.getElementById('stat-rows').innerText = result.summary.totalRows;
        document.getElementById('stat-total').innerText = result.summary.totalItems;
        document.getElementById('stat-good').innerText = result.summary.goodCondition;
        
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = "";
        
        result.data.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-gray-50 align-middle";
          
          // Tangani kolom Foto (bisa berupa teks hyperlink atau URL langsung)
          let fotoContent = '-';
          const rawFoto = item['FOTO'] || '';
          
          if (rawFoto) {
            // Jika isi kolom berupa teks formula HYPERLINK atau URL langsung
            // Kita buat elemen gambar / link yang rapi di sebelah kiri baris
            fotoContent = `
              <div class="flex items-center space-x-2">
                <a href="${rawFoto}" target="_blank" class="block w-12 h-12 rounded overflow-hidden border border-gray-200 bg-gray-100 flex-shrink-0 hover:opacity-80 transition">
                  <img src="${rawFoto}" alt="Foto Barang" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150?text=No+Img'">
                </a>
              </div>
            `;
          }

          tr.innerHTML = `
            <td class="px-4 py-3">${fotoContent}</td>
            <td class="px-4 py-3 font-medium text-gray-800">${item['KODE RUANGAN'] || ''}</td>
            <td class="px-4 py-3">${item['KODE BARANG'] || ''}</td>
            <td class="px-4 py-3 font-medium text-gray-900">${item['NAMA BARANG/ JENIS BARANG'] || item['NAMA BARANG/JENIS BARANG'] || ''}</td>
            <td class="px-4 py-3">${item['MERK/ TYPE'] || '-'}</td>
            <td class="px-4 py-3">${item['JML'] || 0}</td>
            <td class="px-4 py-3">${item['TAHUN'] || ''}</td>
            <td class="px-4 py-3">${item['PENGGUNA'] || '-'}</td>
            <td class="px-4 py-3">
              <span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">
                ${item['KONDISI'] || 'Baik'}
              </span>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } else {
        alert("Gagal memuat data: " + result.message);
      }
    } catch (error) {
      console.error("Error fetching data:", error);
      document.getElementById('loading-state').innerHTML = `<p class="text-red-500">Gagal terhubung ke server database.</p>`;
    }
  }

  fetchInventoryData();
</script>
